seed: 42
# Experiment: AR(1) alpha. regime=neutral (mu=0) and ar=0.35 injects a
# momentum edge into the GBM log-returns (variance-preserving). The only
# alpha in the data is short-horizon autocorrelation the bot could trade.
data:
  n_symbols: 6
  n_steps: 2520
  timeframes:
    low: 5m
    high: 4h
  regime: neutral
  ar: 0.35

env:
  n_envs_per_symbol: 24
  lev_min: 2.0
  lev_max: 150.0
  open_fee_rate: 0.0003
  close_fee_rate: 0.0006
  slippage_bps: 1.0
  holding_fee_daily: 0.00015
  bars_per_day: 288
  liquidation_fee_rate: 0.003
  liq_threshold_base: 0.90
  liq_threshold_floor: 0.67
  liq_threshold_ref_lev: 2.0
  liq_threshold_hi_lev: 150.0
  liq_threshold_lo_lev: 1.0
  liq_mark_impact: 0.005
  min_collateral: 10.0
  max_collateral: 10000.0
  risk_min: 0.01
  risk_max: 0.05
  use_take_profit: true
  use_stop_loss: true
  take_profit: 0.05
  stop_loss: 0.03
  enforce_goal: false
  initial_balance: 1000.0
  margin_mode: isolated
  size_fraction: 1.0
  side_threshold: 0.3
  trade_knob: 3.0
  min_hold_bars: 3

reward:
  mode: smoke
  drawdown_penalty: 0.0
  reward_clip: 10.0

norm:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

report:
  theme: synthwave
  episode_figures: false
  overlays: false

returns:
  basis: collateral
  freq: daily
  rf_annual: 0.045

eval:
  episodes: 3
  max_positions_per_symbol: 1

train:
  total_timesteps: 750000
  log_interval: 1
  log_every: 50000

hrl:
  goal_every: 8
  goal_dim: 3

manager:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  net_arch: [128, 128]

worker:
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 4096
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.2
  net_arch: [256, 256]
