# AR(1)-alpha smoke experiment: pure momentum edge, no drift.
#
# GBM baseline iid log-returns are replaced by an AR(1) process with
# phi=0.35 (variance-preserving: per-step return vol is unchanged). Regime is
# "neutral" (mu=0 for every symbol) so the *only* alpha in the data is the
# autocorrelated move structure — a clean test of whether the HRL stack can
# extract and compound a momentum signal the GBM null model cannot offer.
seed: 42

data:
  n_symbols: 4
  n_steps: 400
  timeframes:
    low: 5m
    high: 4h
  regime: neutral
  ar: 0.35
  ar_noise: 1.71

env:
  n_envs_per_symbol: 4
  lev_min: 2.0
  lev_max: 20.0
  open_fee_rate: 0.0003
  close_fee_rate: 0.0006
  slippage_bps: 1.0
  holding_fee_daily: 0.00015
  bars_per_day: 288
  liquidation_fee_rate: 0.003
  liq_threshold_base: 0.90
  liq_threshold_floor: 0.67
  liq_threshold_ref_lev: 2.0
  liq_threshold_hi_lev: 150.0
  liq_threshold_lo_lev: 1.0
  liq_mark_impact: 0.005
  min_collateral: 10.0
  max_collateral: 10000.0
  risk_min: 0.01
  risk_max: 0.05
  use_take_profit: true
  use_stop_loss: true
  take_profit: 0.05
  stop_loss: 0.03
  enforce_goal: false
  initial_balance: 1000.0
  margin_mode: isolated
  size_fraction: 1.0
  side_threshold: 0.2
  trade_knob: 4.5

reward:
  mode: smoke
  drawdown_penalty: 1.0
  reward_clip: 10.0

norm:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

report:
  theme: synthwave
  episode_figures: false
  overlays: false

returns:
  basis: collateral
  freq: daily
  rf_annual: 0.045

eval:
  episodes: 2
  max_positions_per_symbol: 1
  deterministic: true
  adaptive_knob:
    active: on
    window_days: 3
    occupancy_target: 0.15
    tolerance: 0.02
    p_gain: 1.5
    min_mult: 0.01
    max_mult: 100.0

train:
  total_timesteps: 12800
  log_interval: 1
  log_every: 128

hrl:
  goal_every: 4
  goal_dim: 3

manager:
  learning_rate: 0.0003
  n_steps: 8
  batch_size: 32
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  net_arch: [64, 64]

worker:
  learning_rate: 0.001
  buffer_size: 10000
  learning_starts: 512
  batch_size: 128
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.2
  net_arch: [128, 128]