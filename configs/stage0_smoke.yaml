# Stage 0 smoke: GBM + planted AR through walk-forward + purge/embargo.
#
# Windows sized for harness speed. Use freq=1h so Ulcer/UPI can form.
# A serious Stage 0 attempt should use configs/stage0.yaml — never edit
# roadmap/stage0_gates.yaml after the experiment starts.
seed: 42

data:
  n_symbols: 4
  n_steps: 2800
  timeframes:
    low: 5m
    high: 4h
  regime: neutral
  ar: 0.7
  ar_noise: 1.71

stage0:
  mode: expanding
  n_folds: 3
  train_bars: 800
  test_bars: 600
  purge_bars: 24
  embargo_bars: 24
  seeds: [42, 43]

env:
  n_envs_per_symbol: 4
  lev_min: 2.0
  lev_max: 20.0
  open_fee_rate: 0.0003
  close_fee_rate: 0.0006
  slippage_bps: 1.0
  holding_fee_daily: 0.00015
  bars_per_day: 288
  liquidation_fee_rate: 0.003
  liq_threshold_base: 0.90
  liq_threshold_floor: 0.67
  liq_threshold_ref_lev: 2.0
  liq_threshold_hi_lev: 150.0
  liq_threshold_lo_lev: 1.0
  liq_mark_impact: 0.005
  min_collateral: 10.0
  max_collateral: 10000.0
  risk_min: 0.01
  risk_max: 0.05
  use_take_profit: true
  use_stop_loss: true
  take_profit: 0.05
  stop_loss: 0.03
  enforce_goal: false
  initial_balance: 1000.0
  margin_mode: isolated
  size_fraction: 1.0
  side_threshold: 0.2
  trade_knob: 4.5

reward:
  mode: smoke
  drawdown_penalty: 1.0
  reward_clip: 10.0

norm:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

report:
  theme: synthwave
  episode_figures: false
  overlays: false

returns:
  basis: collateral
  freq: 1h
  rf_annual: 0.045

eval:
  episodes: 1
  max_positions_per_symbol: 1
  deterministic: true

train:
  # Smoke: a few manager updates so CSV trajectories are non-degenerate.
  # cycle ≈ 8 * 4 * 32 = 1024 → 5 updates ≈ 5120 env-steps (budget padded).
  total_timesteps: 12800
  min_manager_updates: 5
  rollout_log_mode: completed_only
  log_interval: 1
  log_every: 256

hrl:
  goal_every: 4
  goal_dim: 3

manager:
  learning_rate: 0.0003
  n_steps: 8
  batch_size: 32
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  net_arch: [64, 64]

worker:
  learning_rate: 0.001
  buffer_size: 10000
  learning_starts: 512
  batch_size: 128
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.2
  net_arch: [128, 128]
