seed: 42

data:
  n_symbols: 8
  n_steps: 2520
  timeframes:
    low: 5m
    high: 4h
  regime: mix

env:
  n_envs_per_symbol: 512   # 8 x 2048 = 16384 parallel envs (stress / plateau region)
  lev_min: 2.0   # floor leverage high so every open starts near the steep liq curve
  lev_max: 150.0
  open_fee_rate: 0.0003
  close_fee_rate: 0.0006
  slippage_bps: 1.0
  holding_fee_daily: 0.00015
  bars_per_day: 288
  liquidation_fee_rate: 0.003
  liq_threshold_base: 0.90
  liq_threshold_floor: 0.67
  liq_threshold_ref_lev: 2.0
  liq_threshold_hi_lev: 150.0
  liq_threshold_lo_lev: 1.0
  liq_mark_impact: 0.005
  min_collateral: 10.0
  max_collateral: 10000.0
  risk_min: 0.01
  risk_max: 0.1
  use_take_profit: false
  use_stop_loss: false
  take_profit: 0.02
  stop_loss: 0.015
  enforce_goal: false
  initial_balance: 1000.0
  margin_mode: isolated
  size_fraction: 1.0
  side_threshold: 0.2
  trade_knob: 6.0

reward:
  mode: normal
  drawdown_penalty: 1.0
  reward_clip: 10.0

norm:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

report:
  theme: synthwave
  episode_figures: false
  overlays: false

returns:
  basis: collateral
  freq: daily
  rf_annual: 0.045

eval:
  episodes: 10
  max_positions_per_symbol: 1
  deterministic: true
  adaptive_knob:
    active: on
    window_days: 3
    occupancy_target: 0.15
    tolerance: 0.02
    p_gain: 1.5
    min_mult: 0.01
    max_mult: 100.0

train:
  # 100M env-steps was previously log_every=1e6 → ~100 worker / ~12 manager
  # rows (steppy, not noise+trend). Align with Stage 0 curve density:
  #   min_manager_updates=50 → planner shrinks n_steps so ~50 PPO rows
  #   log_every=131072 → ~750 SAC mid-cycle dumps
  #   ongoing → ep_* filled every dump (not only on episode end)
  total_timesteps: 100000000
  min_manager_updates: 50
  rollout_log_mode: ongoing
  log_interval: 1
  log_every: 131072

hrl:
  goal_every: 8
  goal_dim: 3

manager:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  net_arch: [128, 128]

worker:
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 4096
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.2
  net_arch: [256, 256]
