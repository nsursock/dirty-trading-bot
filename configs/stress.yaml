seed: 42

data:
  n_symbols: 8
  n_steps: 2520
  timeframes:
    low: 5
    high: 240
  regime: mix

env:
  n_envs_per_symbol: 1024   # 8 x 1024 = 8192 parallel envs (stress / plateau region)
  lev_min: 2.0
  lev_max: 150.0
  fee_rate: 0.0005
  slippage_bps: 1.0
  funding_rate: 0.0001
  maintenance_margin_rate: 0.005
  liquidation_fee_rate: 0.01
  min_collateral: 10.0
  max_collateral: 10000.0
  risk_min: 0.01
  risk_max: 0.1
  enforce_goal: false
  initial_balance: 1000.0
  size_fraction: 1.0
  side_threshold: 0.2
  trade_knob: 1.5

reward:
  mode: normal
  drawdown_penalty: 1.0
  reward_clip: 10.0

norm:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99

report:
  theme: synthwave

train:
  total_timesteps: 100000000
  log_interval: 1

hrl:
  goal_every: 8
  goal_dim: 3

manager:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  net_arch: [128, 128]

worker:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 4096
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256]
